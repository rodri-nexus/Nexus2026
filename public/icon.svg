<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    {/* Degradé para la diagonal de la N que se desvanece */}
    <linearGradient
      id="nevuxDiagonalGrad"
      x1="13.5"
      y1="11.5"
      x2="28.5"
      y2="30.5"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  {/* Círculo base negro */}
  <circle cx="20" cy="20" r="20" fill="#000000" />

  {/* Trazo vertical izquierdo */}
  <rect x="13.5" y="11.5" width="3.5" height="17" fill="#FFFFFF" />

  {/* Trazo vertical derecho superior */}
  <rect x="23" y="11.5" width="3.5" height="9" fill="#FFFFFF" />

  {/* Trazo diagonal cortante que se desvanece */}
  <polygon
    points="13.5,11.5 17,11.5 28.5,30.5 25,30.5"
    fill="url(#nevuxDiagonalGrad)"
  />
</svg>
