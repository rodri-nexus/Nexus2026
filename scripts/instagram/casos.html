<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Carrusel de casos reales (capturas de tiendas dentro de celulares). generar-casos.js le pasa cada placa en window.PLACA. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: Inter, sans-serif; color: #fff; background: #07080a; position: relative; }
  .glow { position: absolute; width: 1100px; height: 1100px; right: -380px; top: -560px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,.40), rgba(16,185,129,0) 62%); }
  .glow2 { position: absolute; width: 900px; height: 900px; left: -520px; bottom: -560px; border-radius: 50%; background: radial-gradient(circle, rgba(45,212,191,.16), rgba(45,212,191,0) 65%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 54px 54px; -webkit-mask-image: radial-gradient(ellipse at 80% 10%, #000 15%, transparent 65%); }
  .top { position: absolute; left: 80px; right: 80px; top: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .marca { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .marca svg { width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
  .marca small { font-size: 24px; font-weight: 600; color: #a1a1aa; margin-left: 4px; }
  .pag { font-size: 24px; font-weight: 700; color: #a1a1aa; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 8px 18px; }
  .eyebrow { font-size: 24px; font-weight: 800; letter-spacing: .16em; color: #6ee7b7; text-transform: uppercase; margin-bottom: 20px; }
  .verde { background: linear-gradient(90deg, #6ee7b7, #99f6e4); -webkit-background-clip: text; color: transparent; }
  .cab { position: absolute; left: 80px; right: 80px; top: 165px; z-index: 2; text-align: center; }
  .cab h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.04em; }
  .cab p { margin-top: 18px; font-size: 32px; line-height: 1.35; color: #a1a1aa; font-weight: 500; }
  .tel { position: relative; border-radius: 54px; background: linear-gradient(160deg, #2a2a2e, #141416); padding: 12px; box-shadow: 0 50px 110px -20px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.1), inset 0 0 0 2px rgba(255,255,255,.05); }
  .tel .in { width: 100%; height: 100%; border-radius: 43px; overflow: hidden; background: #fff; position: relative; }
  .tel img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .tel .isla { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; border-radius: 20px; background: #000; z-index: 2; }
  .dos { position: absolute; left: 0; right: 0; bottom: 70px; display: flex; justify-content: center; gap: 44px; z-index: 2; }
  .dos .tel { width: 370px; height: 800px; }
  .dos .tel:nth-child(1) { transform: rotate(-3deg) translateY(10px); }
  .dos .tel:nth-child(2) { transform: rotate(3deg) translateY(10px); }
  .rot { position: absolute; left: 50%; transform: translateX(-50%); bottom: -46px; white-space: nowrap; font-size: 22px; font-weight: 800; letter-spacing: .12em; color: #07080a; background: #34d399; border-radius: 10px; padding: 7px 14px; }
  .split .txt { position: absolute; left: 80px; top: 190px; bottom: 90px; width: 470px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .split h2 { font-size: 66px; line-height: 1.04; font-weight: 800; letter-spacing: -.04em; }
  .lista { margin-top: 36px; display: flex; flex-direction: column; gap: 22px; }
  .lista div { display: flex; gap: 16px; font-size: 30px; line-height: 1.32; font-weight: 600; color: #e4e4e7; }
  .lista svg { flex: none; width: 38px; height: 38px; margin-top: 1px; }
  .split .tel { position: absolute; right: 70px; top: 175px; width: 440px; height: 952px; z-index: 2; transform: rotate(2deg); }
  .cta { position: absolute; left: 80px; right: 80px; top: 190px; bottom: 170px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .cta h1 { font-size: 104px; line-height: 1.0; font-weight: 800; letter-spacing: -.045em; }
  .cta p { margin-top: 36px; font-size: 40px; line-height: 1.4; color: #d4d4d8; font-weight: 500; }
  .palabra { display: inline-block; background: #fff; color: #07080a; font-weight: 900; border-radius: 12px; padding: 2px 16px; }
  .pie { position: absolute; left: 80px; right: 80px; bottom: 60px; display: flex; justify-content: space-between; font-size: 24px; font-weight: 700; color: #71717a; z-index: 3; }
  .pie .d { color: #34d399; }
</style>
</head>
<body>
<div class="glow"></div><div class="glow2"></div><div class="grid"></div>
<div id="r"></div>
<script>
const P = window.PLACA || {};
const LOGO = `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="13.5" y1="11.5" x2="28.5" y2="30.5" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><circle cx="20" cy="20" r="20" fill="#000"/><rect x="13.5" y="11.5" width="3.5" height="17" fill="#fff"/><rect x="23" y="11.5" width="3.5" height="9" fill="#fff"/><polygon points="13.5,11.5 17,11.5 28.5,30.5 25,30.5" fill="url(#g)"/></svg>`;
const OK = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="rgba(52,211,153,.16)"/><path d="m7 12.5 3.2 3.2L17 9" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const tel = (src, rot) => `<div class="tel"><div class="in"><img src="casos/${src}.jpg"></div>${rot ? `<span class="rot">${rot}</span>` : ""}</div>`;
let h = `<div class="top"><div class="marca">${LOGO}Nevux<small>@nevux.app</small></div><span class="pag">${P.pag || ""}</span></div>`;
if (P.tipo === "dos") h += `<div class="cab">${P.eyebrow ? `<div class="eyebrow">${P.eyebrow}</div>` : ""}<h1>${P.titulo}</h1>${P.sub ? `<p>${P.sub}</p>` : ""}</div><div class="dos">${P.fotos.map(([f, r]) => tel(f, r)).join("")}</div>`;
if (P.tipo === "split") h += `<div class="split"><div class="txt">${P.eyebrow ? `<div class="eyebrow">${P.eyebrow}</div>` : ""}<h2>${P.titulo}</h2><div class="lista">${P.lista.map((x) => `<div>${OK}<span>${x}</span></div>`).join("")}</div></div>${tel(P.foto)}</div>`;
if (P.tipo === "cta") h += `<div class="cta">${P.eyebrow ? `<div class="eyebrow">${P.eyebrow}</div>` : ""}<h1>${P.titulo}</h1><p>${P.texto}</p></div><div class="pie"><span>nevux.ar</span><span class="d">Guardalo para después</span></div>`;
document.getElementById("r").innerHTML = h;
</script>
</body>
</html>
